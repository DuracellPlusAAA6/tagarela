<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tagarela · TTS diagnostic</title>
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #2c241d; background: #faf6f0; }
  h1 { font-size: 20px; }
  p.note { color: #666; font-size: 13px; }
  button { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 16px; border: 1px solid #e0d6c8; border-radius: 10px; background: #fff; font-size: 15px; cursor: pointer; }
  button:hover { border-color: #e8714d; }
  button b { color: #e8714d; }
  #log { margin-top: 20px; background: #1e1a16; color: #c8e6c9; font: 12px/1.5 ui-monospace, monospace; padding: 14px; border-radius: 10px; white-space: pre-wrap; min-height: 120px; max-height: 50vh; overflow: auto; }
  .err { color: #ff8a80; }
  .ok { color: #a5d6a7; }
</style>
</head>
<body>
  <h1>tagarela · TTS diagnostic</h1>
  <p class="note">Click each button and listen. The log below records every event. Tell me which ones make sound and paste the log.</p>

  <button onclick="testGoogle('tw-ob')">Test 1 — Google TTS (<b>client=tw-ob</b>)</button>
  <button onclick="testGoogle('gtx')">Test 2 — Google TTS (<b>client=gtx</b>)</button>
  <button onclick="testGoogleCors()">Test 3 — Google TTS via <b>fetch + blob</b></button>
  <button onclick="testBrowser()">Test 4 — Browser <b>Web Speech API</b></button>
  <button onclick="listVoices()">Test 5 — List browser voices</button>

  <div id="log">ready.\n</div>

<script>
const logEl = document.getElementById('log');
function log(msg, cls) {
  const line = document.createElement('span');
  if (cls) line.className = cls;
  line.textContent = msg + '\n';
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function testGoogle(client) {
  const url = "https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=en&q=" +
    encodeURIComponent("Hello, this is a test of Google text to speech.") + "&client=" + client;
  log("[" + client + "] creating Audio()…");
  const audio = new Audio(url);
  audio.onloadeddata = () => log("[" + client + "] loadeddata (audio data received)", "ok");
  audio.oncanplay   = () => log("[" + client + "] canplay", "ok");
  audio.onplay      = () => log("[" + client + "] play event fired", "ok");
  audio.onended     = () => log("[" + client + "] ended — DONE", "ok");
  audio.onerror     = () => log("[" + client + "] ERROR: " + (audio.error ? audio.error.code + " / " + audio.error.message : "unknown"), "err");
  audio.play().then(() => log("[" + client + "] play() promise resolved", "ok"))
              .catch(e => log("[" + client + "] play() REJECTED: " + e.name + " — " + e.message, "err"));
}

async function testGoogleCors() {
  const url = "https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=en&q=" +
    encodeURIComponent("Fetch and blob test.") + "&client=tw-ob";
  log("[fetch] requesting…");
  try {
    const r = await fetch(url);
    log("[fetch] status " + r.status + " type " + r.headers.get("content-type"), r.ok ? "ok" : "err");
    const blob = await r.blob();
    log("[fetch] blob size " + blob.size + " bytes", "ok");
    const a = new Audio(URL.createObjectURL(blob));
    a.onended = () => log("[fetch] ended — DONE", "ok");
    a.onerror = () => log("[fetch] audio error", "err");
    await a.play();
    log("[fetch] playing…", "ok");
  } catch (e) {
    log("[fetch] FAILED: " + e.name + " — " + e.message, "err");
  }
}

function testBrowser() {
  if (!window.speechSynthesis) { log("[browser] speechSynthesis NOT available", "err"); return; }
  log("[browser] cancel() then speak()…");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance("Hello, this is the browser speech engine.");
  u.lang = "en-US";
  u.onstart = () => log("[browser] start", "ok");
  u.onend   = () => log("[browser] end — DONE", "ok");
  u.onerror = (e) => log("[browser] ERROR: " + e.error, "err");
  speechSynthesis.speak(u);
  setTimeout(() => log("[browser] speaking=" + speechSynthesis.speaking + " pending=" + speechSynthesis.pending), 300);
}

function listVoices() {
  const v = speechSynthesis.getVoices();
  log("[voices] count: " + v.length);
  v.slice(0, 40).forEach(x => log("  • " + x.name + " (" + x.lang + ")" + (x.localService ? " [local]" : " [network]")));
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => log("[voices] voiceschanged fired — " + speechSynthesis.getVoices().length + " voices now available");
</script>
</body>
</html>
